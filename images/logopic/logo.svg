<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" role="img" aria-label="UCM Imaging Lab logo">
  <title>UCM Imaging Lab</title>
  <desc>Logo of UCM Imaging Lab. Concentric ring interference pattern crossed by a horizontal sine wave, alongside the laboratory name.</desc>

  <g transform="translate(20, 20)" fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <circle cx="40" cy="40" r="36"/>
    <circle cx="40" cy="40" r="29"/>
    <circle cx="40" cy="40" r="22"/>
    <circle cx="40" cy="40" r="15"/>
    <circle cx="40" cy="40" r="8"/>
    <g opacity="0.5">
      <circle cx="48" cy="40" r="36"/>
      <circle cx="48" cy="40" r="29"/>
      <circle cx="48" cy="40" r="22"/>
      <circle cx="48" cy="40" r="15"/>
      <circle cx="48" cy="40" r="8"/>
    </g>
    <path d="M -12 40 Q 0 25, 12 40 T 36 40 T 60 40 T 84 40 T 108 40" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text x="130" y="50" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#1a1a1a">UCM Imaging Lab</text>
  <text x="130" y="74" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Medical Physics &amp; Biomedical Instrumentation</text>
  <text x="130" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#888">Universidad Complutense de Madrid</text>
</svg>
