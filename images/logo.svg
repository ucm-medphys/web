<svg width="320" height="64" viewBox="0 0 320 64" xmlns="http://www.w3.org/2000/svg">

  <!-- =============================================
       ICON: radiation field crosshair
       The standard X-ray field-centering indicator
       used on every radiographic positioning system
       ============================================= -->

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#2c7bb6" stroke-width="2"/>

  <!-- Crosshair lines (extending slightly beyond ring) -->
  <line x1="32" y1="2"  x2="32" y2="15" stroke="#2c7bb6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="32" y1="49" x2="32" y2="62" stroke="#2c7bb6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="2"  y1="32" x2="15" y2="32" stroke="#2c7bb6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="49" y1="32" x2="62" y2="32" stroke="#2c7bb6" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Inner ring (double-circle detail, common in field indicators) -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="#2c7bb6" stroke-width="1.2" opacity="0.55"/>

  <!-- Center focal point -->
  <circle cx="32" cy="32" r="3" fill="#2c7bb6"/>

  <!-- =============================================
       SEPARATOR
       ============================================= -->
  <line x1="78" y1="10" x2="78" y2="54" stroke="#d0d8e0" stroke-width="1.5"/>

  <!-- =============================================
       TEXT
       ============================================= -->

  <!-- UCM in blue badge -->
  <rect x="90" y="10" width="38" height="18" rx="2.5" fill="#2c7bb6"/>
  <text x="109" y="23"
        text-anchor="middle"
        font-family="Inter,-apple-system,BlinkMacSystemFont,Helvetica,sans-serif"
        font-size="11.5" font-weight="700" fill="white" letter-spacing="1.5">UCM</text>

  <!-- X-Ray (main brand name) -->
  <text x="134" y="25"
        font-family="Inter,-apple-system,BlinkMacSystemFont,Helvetica,sans-serif"
        font-size="22" font-weight="700" fill="#1a1a2e" letter-spacing="-0.3">X-Ray</text>

  <!-- Thin rule -->
  <rect x="90" y="33" width="222" height="1" fill="#2c7bb6" opacity="0.25"/>

  <!-- Descriptor -->
  <text x="91" y="50"
        font-family="Inter,-apple-system,BlinkMacSystemFont,Helvetica,sans-serif"
        font-size="13.5" font-weight="500" fill="#2c7bb6" letter-spacing="3">IMAGING GROUP</text>

</svg>
