<svg width="230" height="40" viewBox="0 0 230 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: simplified chest radiograph -->

  <!-- Film (dark background, like an actual X-ray plate) -->
  <rect x="2" y="1" width="32" height="38" rx="2" fill="#1a1a2e"/>
  <!-- Subtle inner border -->
  <rect x="3.5" y="2.5" width="29" height="35" rx="1.5" fill="none" stroke="#2c7bb6" stroke-width="0.7" opacity="0.45"/>

  <!-- Left lung field (air = bright) -->
  <ellipse cx="12" cy="21" rx="7" ry="12" fill="white" opacity="0.27"/>
  <!-- Right lung field -->
  <ellipse cx="24" cy="21" rx="7" ry="12" fill="white" opacity="0.27"/>

  <!-- Heart / mediastinum shadow (denser = darker) -->
  <ellipse cx="17" cy="25" rx="5.5" ry="7.5" fill="#1a1a2e"/>

  <!-- Ribs — left (2 curves) -->
  <path d="M14 14 Q8 16 7 19"  fill="none" stroke="white" stroke-width="0.9" opacity="0.35" stroke-linecap="round"/>
  <path d="M14 21 Q8 23 7 26"  fill="none" stroke="white" stroke-width="0.9" opacity="0.35" stroke-linecap="round"/>
  <!-- Ribs — right -->
  <path d="M22 14 Q28 16 29 19" fill="none" stroke="white" stroke-width="0.9" opacity="0.35" stroke-linecap="round"/>
  <path d="M22 21 Q28 23 29 26" fill="none" stroke="white" stroke-width="0.9" opacity="0.35" stroke-linecap="round"/>

  <!-- separator -->
  <line x1="47" y1="7" x2="47" y2="33" stroke="#d0d8e0" stroke-width="1"/>

  <!-- text -->
  <text x="57" y="21" font-family="Inter,-apple-system,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e" letter-spacing="-0.3">UCM X-Ray</text>
  <text x="57" y="35" font-family="Inter,-apple-system,Helvetica,sans-serif" font-size="10.5" font-weight="500" fill="#2c7bb6" letter-spacing="0.6">IMAGING GROUP</text>
</svg>
